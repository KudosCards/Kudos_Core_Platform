[build]
  base = "apps/web"
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = ".next"

[build.environment]
  # Netlify scans the build output for the values of secret env vars, and
  # Turbopack's on-disk cache (`.next/cache/turbopack/*.sst`) trips it: the
  # compiler persists module contents there, so anything inlined at build time
  # is in it, and the scanner reads those files as text.
  #
  # Scoped to the cache directories, and deliberately not to the key or to
  # scanning as a whole. The cache is a build artefact — saved and restored
  # between builds, never served — while everything that *is* deployed
  # (`server/`, `static/`, the functions) is still scanned. That makes this
  # safe by construction: a secret genuinely reaching deployable output would
  # still fail the build, so this cannot mask a real leak.
  #
  # Verified before adding: a build with a sentinel value for
  # CATALOG_REVALIDATE_SECRET put that value in *no* build file at all —
  # cache, server chunks or client chunks — while a control value known to be
  # inlined (NEXT_PUBLIC_API_URL) appeared in seven cache files and in both
  # server and static chunks. So the scanner reads the cache correctly; what it
  # matched on is the real value's own content. See ADR 0235.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**,apps/web/.next/cache/**,apps/web/.netlify/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Analytics runs on the live site only. Deploy previews and branch builds don't
# get the measurement id, so a preview someone clicks through — or a local
# `next dev` — can't report developer traffic as real visits. Not a secret: a
# GA4 measurement id is served in the page source of every site that uses one.
[context.production.environment]
  NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-9P27FHKPXY"

# Force the free *.netlify.app subdomain to the canonical custom domain. Netlify
# makes the site reachable at both, but the API's CORS allow-list only trusts the
# custom domain (WEB_APP_URL), so any app loaded from the netlify.app mirror gets
# its API calls blocked. Setting the primary domain does NOT auto-redirect the
# netlify.app subdomain, so we do it explicitly. `force = true` makes this win
# over the Next.js handler. Deploy previews (deploy-preview-*--…) are unaffected.
# See ADR 0080.
[[redirects]]
  from = "https://kudos-cards.netlify.app/*"
  to = "https://kudos-cards.co.uk/:splat"
  status = 301
  force = true
